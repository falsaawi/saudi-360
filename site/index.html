<title>Saudi 360</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette read off the reference site: warm near-black ground, teal accent,
     slate panels, white headings over grey body text. */
  :root{
    --bg:#1e1c1c; --panel:#1f2832; --panel2:#023444; --rail:#171616;
    --acc:#009dad; --acc2:#00c3d6; --accdim:#114c63;
    --ink:#ffffff; --ink2:#c1c2c5; --ink3:#8c8f94; --ink4:#5f6367;
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --warn:#f0a63c; --warnbg:#3a2a0d; --down:#ff6b5a; --up:#2ec4a6;
    --sans:"Barlow","IBM Plex Sans Arabic",system-ui,sans-serif;
    --cond:"Barlow Semi Condensed","IBM Plex Sans Arabic",system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#f4f5f6; --panel:#ffffff; --panel2:#e6f4f6; --rail:#eceef0;
    --acc:#00808f; --acc2:#00808f; --accdim:#cfe9ee;
    --ink:#10161c; --ink2:#42474d; --ink3:#71767c; --ink4:#9aa0a6;
    --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.18);
    --warn:#8a5a10; --warnbg:#fdf1dc; --down:#c0392b; --up:#0b7a63;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink2);font:400 15px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased}
  [dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--sans)}
  a{color:var(--acc2);text-decoration:none} a:hover{text-decoration:underline}
  h1,h2,h3,h4{color:var(--ink);font-family:var(--cond);font-weight:700;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:22px;padding-block:0 70px}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--rail);
    border-bottom:1px solid var(--line)}
  .nav{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .brand{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink);white-space:nowrap}
  .brand span{color:var(--acc2)}
  .nav a.tab{font-family:var(--cond);font-size:14px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink2);padding:6px 0}
  .nav a.tab.on{color:var(--acc2)}
  .nav a.tab:hover{color:var(--ink);text-decoration:none}
  .spacer{flex:1}
  button,select,input{font:inherit;color:var(--ink);background:transparent;
    border:1px solid var(--line2);border-radius:4px;padding:6px 12px}
  button{cursor:pointer;font-size:13px;font-family:var(--cond);letter-spacing:.05em;
    text-transform:uppercase}
  button:hover{border-color:var(--acc)}
  button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  select{background:var(--panel)} option{background:var(--panel);color:var(--ink)}
  input[type=search]{min-width:190px;border-radius:32px;padding:6px 16px;background:var(--panel)}

  .hero{background:linear-gradient(180deg,var(--panel2) 0%,var(--bg) 100%);
    border-bottom:1px solid var(--line);margin-bottom:34px}
  .hero .in{max-width:1180px;margin:0 auto;padding:58px 22px 44px;text-align:center}
  .hero h1{font-size:clamp(30px,5.2vw,54px);line-height:1.04;letter-spacing:.01em;
    text-transform:uppercase;margin:0 0 16px}
  .hero h1 em{font-style:normal;color:var(--acc2)}
  .hero p{font-size:16px;color:var(--ink2);max-width:62ch;margin:0 auto}

  .sec{margin:42px 0 16px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .sec .mk{width:15px;height:15px;border-radius:3px;background:var(--acc);flex:none;
    box-shadow:0 0 0 4px rgba(0,157,173,.16)}
  .sec h2{font-size:21px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2)}
  .sec h2 a{color:inherit}
  .sec .c{font-family:var(--sans);font-size:12.5px;letter-spacing:.02em;text-transform:none;
    color:var(--ink3);font-weight:400;margin-inline-start:auto}
  .sub2{font-size:16px;color:var(--ink);margin:0 0 14px;font-family:var(--cond);
    letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .lede{color:var(--ink2);max-width:72ch;margin:0 0 22px}
  .crumb{font-size:12.5px;color:var(--ink3);margin-top:22px;letter-spacing:.04em;
    text-transform:uppercase;font-family:var(--cond)}
  h1.page{font-size:clamp(26px,4vw,38px);text-transform:uppercase;letter-spacing:.02em;margin:8px 0 8px}

  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(auto-fit,minmax(262px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .card.pad0{padding:0;overflow:hidden}
  a.card{display:block;color:inherit;position:relative;min-height:104px}
  a.card:hover{border-color:var(--acc);text-decoration:none}
  a.card .tag{position:absolute;top:10px;inset-inline-end:12px;font-family:var(--cond);
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc2);
    background:rgba(0,157,173,.12);border:0;padding:3px 8px;border-radius:3px}
  a.card h3{font-size:17px;letter-spacing:.02em;margin:0 0 6px;padding-inline-end:76px}
  .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:3px;font-family:var(--cond);
    letter-spacing:.08em;text-transform:uppercase;background:var(--rail);color:var(--ink2);
    border:1px solid var(--line)}
  .tag.acc{background:rgba(0,157,173,.14);color:var(--acc2);border-color:transparent}

  /* Five pinned headlines: at 186px they fit four to a row on a laptop and the
     fifth sat alone against an empty half-row. 150px lets all five share one. */
  .kpis2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
  .kpi2{background:var(--panel);padding:18px 20px}
  .kpi2 .n{font-family:var(--cond);font-size:38px;font-weight:700;line-height:1;color:var(--ink);
    font-variant-numeric:tabular-nums;display:block}
  .kpi2 .n.dn{color:var(--down)} .kpi2 .n.up{color:var(--up)}
  .kpi2 .t{font-family:var(--cond);font-size:13px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink);margin-top:9px}
  .kpi2 .s{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.45}
  .kpi2 .p{font-family:var(--cond);font-size:11px;color:var(--acc2);margin-top:6px;
    letter-spacing:.11em;text-transform:uppercase}
  .kpi .lab{font-family:var(--cond);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink3);margin-bottom:6px}
  .kpi .val{font-family:var(--cond);font-size:30px;font-weight:700;color:var(--ink);
    font-variant-numeric:tabular-nums;line-height:1}
  .kpi .sub{font-size:12px;color:var(--ink3);margin-top:4px}

  .split{display:grid;gap:8px;margin:0 0 14px}
  .srow{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
  .srow button{border-radius:4px;background:var(--rail);border:1px solid var(--line);
    padding:9px 12px;font-size:12.5px;letter-spacing:.08em;color:var(--ink2)}
  .srow button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

  .subg{border-top:1px solid var(--line);padding:16px 0}
  .subg h3{font-family:var(--cond);font-size:12.5px;text-transform:uppercase;letter-spacing:.11em;
    color:var(--ink3);font-weight:600;margin:0 0 10px}
  .plist{display:flex;flex-wrap:wrap;gap:7px}
  .plink{display:inline-flex;align-items:baseline;gap:8px;font-size:13.5px;padding:7px 13px;
    border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
  .plink:hover{border-color:var(--acc);color:var(--acc2);text-decoration:none}
  .plink .n{font-family:var(--cond);font-size:11px;color:var(--acc2);font-variant-numeric:tabular-nums}
  .plink.empty{color:var(--ink3);border-style:dashed}

  .warnbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:6px;
    padding:13px 16px;font-size:14px;margin:0 0 18px;color:var(--ink2)}
  .warnbox b{color:var(--warn)}
  .chart{width:100%;height:352px}
  .chart.sm{height:248px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line)}
  th{font-family:var(--cond);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--ink3);font-weight:600}
  td{color:var(--ink2)}
  td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .scroll{overflow-x:auto}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:12.5px;padding:6px 12px;border-radius:4px;border:1px solid var(--line);
    background:var(--rail);color:var(--ink2);cursor:pointer;text-align:start}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .picker{max-height:236px;overflow:auto;border:1px solid var(--line);border-radius:6px;
    padding:9px;background:var(--rail)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--ink3);font-size:12.5px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink4)}
  .note{font-size:12.5px;color:var(--ink3);margin:10px 0 0}
  .prose{font-size:15px;color:var(--ink2);max-width:76ch;line-height:1.75}
  .prose b{color:var(--ink);font-weight:600}
  footer{border-top:1px solid var(--line);margin-top:46px;padding-top:20px;font-size:12.5px;color:var(--ink4)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  [hidden]{display:none!important}
  @media(max-width:520px){.chart{height:290px}.hero .in{padding:40px 22px 32px}}
</style>

 "Environmental and Spatial Statistics":"الإحصاءات البيئية والمكانية","Archived Data":"البيانات المؤرشفة"};

// Series of different kinds do not share a y-axis: an index sits near 100 while
// a percentage change sits near zero, so drawing them together flattens both.
function kindsFor(p){
  const ks=[...new Set(p.series.map(s=>s.kind))].filter(Boolean);
  return ["all", ...["index","change","value"].filter(k=>ks.includes(k))];
}
function seriesFor(p){
  return kindFilter==="all"?p.series:p.series.filter(s=>s.kind===kindFilter);
}

async function loadGeo(){
  if(G&&geoJson)return true;
  try{
    if(!G) G=await fetch("geo.json",{cache:"no-cache"}).then(r=>r.json());
    if(!geoJson){ geoJson=await fetch("geo/sau.geo.json",{cache:"no-cache"}).then(r=>r.json());
      echarts.registerMap("sau",geoJson); }
    return true;
  }catch(e){ return false; }
}
const $=s=>document.querySelector(s);
const t=()=>T[L];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=(n,d=0)=>n==null?"—":Number(n).toLocaleString(L==="ar"?"ar-SA-u-nu-latn":"en-US",
  {minimumFractionDigits:d,maximumFractionDigits:d});
const cvar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function pkey(p){const m=/^(\d{4})(?:-(Q)?(\d{1,2}))?$/.exec(p||"");
  if(!m)return 0; const y=+m[1]; if(!m[3])return y*100;
  return y*100+(m[2]?+m[3]*3:+m[3]);}
function plabel(p){const m=/^(\d{4})(?:-(Q)?(\d{1,2}))?$/.exec(p||"");
  if(!m)return p; if(!m[3])return m[1];
  if(m[2])return (L==="ar"?"ر":"Q")+m[3]+" "+m[1];
  const MM={en:["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
            ar:["","يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]};
  return MM[L][+m[3]]+" "+m[1];}
const sname=s=>{const a=L==="ar"?(s.row_ar||s.row):(s.row||s.row_ar),
                b=L==="ar"?(s.col_ar||s.col):(s.col||s.col_ar);
  // blab is set only where a product charts more than one index base, and it
  // is what distinguishes a rebased run from the one it replaced.
  return [[a,b].filter(Boolean).join(" · ")||"—", s.blab?`(${s.blab})`:""]
    .filter(Boolean).join(" ");};
// The source file, linked back to GASTAT so a reader can open the workbook and
// check the figure against the cell it was read from. Only a path on GASTAT's
// own document server becomes a link; anything else stays plain text, so a
// malformed catalogue row can never turn into a link somewhere else.
const GASTAT="https://www.stats.gov.sa";
function srcLink(r){
  const f=esc(r.file||"—");
  if(!r.url||!/^\/documents\//.test(r.url))return f;
  return `<a href="${esc(GASTAT+r.url)}" target="_blank" rel="noopener noreferrer">${f}</a>`;
}
// The workbook tables a set of plotted series was read from.
const srcTables=ss=>[...new Set(ss.map(s=>(s.table||"").trim()).filter(Boolean))].sort();
// Where the charts stop, when that is short of the product's own coverage.
// Compared by year on purpose: "2026-03" and "2026-Q1" are the same quarter
// written two ways, and comparing the strings whole reports a gap that is not
// there. A shortfall worth warning about is a matter of years, not months.
function chartLag(p){
  if(!p.series||!p.series.length)return null;
  const last=p.series.reduce((m,s)=>{const e=s.pts[s.pts.length-1][0];return e>m?e:m;},"");
  if(!last||!p.last)return null;
  return last.slice(0,4)<p.last.slice(0,4)?last:null;
}
// Arabic names exist for 16 of 20 products; the four archived series are not in
// GASTAT's live Arabic taxonomy, so they keep their English name rather than a
// machine translation of an official statistical title.
const pname=p=>(L==="ar"&&p.name_ar)?p.name_ar:p.name;
const subname=p=>(L==="ar"&&p.subdomain_ar)?p.subdomain_ar:p.subdomain;
const dname=d=>L==="ar"?(DOM_AR[d]||d):d;

function axis(){
  return {ink:cvar("--ink2"),muted:cvar("--ink3"),line:cvar("--line"),card:cvar("--card")};
}
function lineOpt(series,labels,{legend=true,area=false}={}){
  const a=axis();
  return {backgroundColor:"transparent",animation:false,
    grid:{left:6,right:14,top:legend?34:14,bottom:6,containLabel:true},
    tooltip:{trigger:"axis",backgroundColor:a.card,borderColor:a.line,
      textStyle:{color:cvar("--ink"),fontSize:12},
      valueFormatter:v=>v==null?"—":num(v,2)},
    legend:legend?{top:0,type:"scroll",textStyle:{color:a.ink,fontSize:11.5},
      itemWidth:14,itemHeight:8,pageIconColor:a.ink}:{show:false},
    xAxis:{type:"category",data:labels,boundaryGap:false,
      axisLine:{lineStyle:{color:a.line}},axisTick:{show:false},
      axisLabel:{color:a.muted,fontSize:11,hideOverlap:true}},
    yAxis:{type:"value",scale:true,splitLine:{lineStyle:{color:a.line}},
      axisLabel:{color:a.muted,fontSize:11,formatter:v=>num(v,0)}},
    series:series.map((s,i)=>({name:s.name,type:"line",symbol:"none",smooth:false,
      connectNulls:false,lineStyle:{width:2},color:cvar(PAL[i%PAL.length]),
      areaStyle:area?{opacity:.10}:undefined,data:s.data}))};
}
function barOpt(rows){
  const a=axis();
  return {backgroundColor:"transparent",animation:false,
    grid:{left:6,right:22,top:8,bottom:6,containLabel:true},
    tooltip:{trigger:"item",backgroundColor:a.card,borderColor:a.line,
      textStyle:{color:cvar("--ink"),fontSize:12},
      formatter:p=>`${esc(p.name)}<br><b>${num(p.value,2)}</b>`},
    xAxis:{type:"value",splitLine:{lineStyle:{color:a.line}},
      axisLabel:{color:a.muted,fontSize:11,formatter:v=>num(v,0)}},
    yAxis:{type:"category",inverse:true,data:rows.map(r=>r.label),
      axisLine:{show:false},axisTick:{show:false},
      axisLabel:{color:a.muted,fontSize:11,width:170,overflow:"truncate"}},
    series:[{type:"bar",barMaxWidth:18,itemStyle:{borderRadius:[0,4,4,0],color:cvar("--c1")},
      data:rows.map(r=>r.value)}]};
}

function alignSeries(list,rebase){
  const keys=[...new Set(list.flatMap(s=>s.pts.map(p=>p[0])))].sort((a,b)=>pkey(a)-pkey(b));
  const out=list.map(s=>{
    const m=new Map(s.pts);
    let base=null;
    if(rebase){for(const k of keys){if(m.has(k)&&m.get(k)){base=m.get(k);break;}}}
    return {name:sname(s),data:keys.map(k=>{
      if(!m.has(k))return null;
      const v=m.get(k);
      return rebase&&base?+(v/base*100).toFixed(2):v;})};
  });
  return {keys,out};
}

function narrative(hs){
  if(!hs||!hs.length)return "";
  const by={}; hs.forEach(h=>by[h.id]=h);
  const T_=t(), bits=[];
  const say=(h)=>`<b>${esc(fmtKpi(h))}</b>`;
  if(by.inflation)bits.push(L==="ar"
    ? `بلغ التضخم المقيس بالرقم القياسي لأسعار المستهلك ${say(by.inflation)} في ${esc(plabel(by.inflation.period))} مقارنة بالشهر نفسه من العام السابق.`
    : `Inflation, measured by the consumer price index, ran at ${say(by.inflation)} in ${esc(plabel(by.inflation.period))} against the same month a year earlier.`);
  if(by.unemp_all&&by.unemp_saudi)bits.push(L==="ar"
    ? `وبلغ معدل البطالة لجميع السكان ${say(by.unemp_all)} في ${esc(plabel(by.unemp_all.period))}، بينما بلغ بين السعوديين ${say(by.unemp_saudi)}.`
    : `Unemployment across all residents stood at ${say(by.unemp_all)} in ${esc(plabel(by.unemp_all.period))}, while among Saudi nationals it was ${say(by.unemp_saudi)}.`);
  if(by.ipi)bits.push(L==="ar"
    ? `وسجّل الرقم القياسي للإنتاج الصناعي ${say(by.ipi)} في ${esc(plabel(by.ipi.period))} على أساس سنوي.`
    : `The industrial production index moved ${say(by.ipi)} year on year in ${esc(plabel(by.ipi.period))}.`);
  return `<p class="prose" style="margin-top:20px">${bits.join(" ")}</p>`;
}

function fmtKpi(h){
  const v=h.value, sign=(h.id==="inflation"||h.id==="ipi")&&v>0?"+":"";
  return sign+num(v,1)+h.unit;
}
function groupTree(list){
  // GASTAT's own shape: domain -> sub-domain -> product. Rebuilding it here
  // keeps the site navigable the way the source organisation publishes.
  const t=new Map();
  for(const p of list){
    if(!t.has(p.domain))t.set(p.domain,new Map());
    const subs=t.get(p.domain), key=p.subdomain||"—";
    if(!subs.has(key))subs.set(key,[]);
    subs.get(key).push(p);
  }
  return t;
}
function subName(p){return (L==="ar"&&p.subdomain_ar)?p.subdomain_ar:(p.subdomain||"—");}
function productPill(p){
  const n=p.series.length;
  return `<a class="plink ${n?"":"empty"}" href="#/product/${esc(p.id)}">${esc(pname(p))}`+
         (n?`<span class="n">${num(n)}</span>`:"")+`</a>`;
}

function drawMap(){
  if(!G||!geoJson||!$("#c-map"))return;

  const vals=(G.values[mapSel.metric]||{})[mapSel.period]||{};
  const entries=G.regions.filter(r=>vals[r.id]!=null).map(r=>({name:r.id,value:vals[r.id]}));
  const missing=G.regions.filter(r=>vals[r.id]==null);

    visualMap:{min:lo,max:hi,left:"left",bottom:14,calculable:true,
      textStyle:{color:a.muted,fontSize:11},
      inRange:{color:["#e1f5ee","#9fe1cb","#5dcaa5","#1d9e75","#0f6e56"]},
      // A region GASTAT did not report is left neutral, not shaded as if it
      // held a value at the bottom of the scale.
      outOfRange:{color:cvar("--soft")}},
    series:[{type:"map",map:"sau",roam:false,nameProperty:"name",
      itemStyle:{borderColor:a.line,borderWidth:.6,areaColor:cvar("--soft")},
      emphasis:{label:{show:false},itemStyle:{borderColor:cvar("--acc"),borderWidth:1.6}},
      select:{disabled:true},

  const ranked=entries.slice().sort((x,y)=>y.value-x.value);
  const T_=t();

    ranked.map(e=>`<tr><td>${esc(regName(e.name))}</td><td class="n">${num(e.value,2)}</td></tr>`).join("")+
    missing.map(r=>`<tr><td class="muted">${esc(regName(r.id))}</td><td class="n muted">${esc(t().nodata)}</td></tr>`).join("")+

// Saving a file goes through the host when the page runs inside the artifact
// viewer, which never lets a page download on its own; a plain <a download>
// there is a button that does nothing. Self-hosted, there is no host to ask,
// so the anchor is the fallback rather than the primary path.
let saver=null, saverReady=false;
async function getSaver(){
  if(saverReady)return saver;
  saverReady=true;
  try{ saver=(window.claude&&claude.use)?await claude.use("downloads"):null; }
  catch(e){ saver=null; }
  return saver;
}
function csvText(list){
  const keys=[...new Set(list.flatMap(s=>s.pts.map(p=>p[0])))].sort((a,b)=>pkey(a)-pkey(b));
  const head=["period",...list.map(s=>sname(s).replace(/"/g,"'"))];
  const lines=[head.map(h=>`"${h}"`).join(",")];
  keys.forEach(k=>{const m=list.map(s=>{const f=s.pts.find(p=>p[0]===k);return f?f[1]:"";});
    lines.push([k,...m].join(","));});
  return "﻿"+lines.join("\n");
}
async function downloadCSV(list,name,btn){
  if(!list.length)return;
  const filename=name.replace(/[^\w؀-ۿ]+/g,"_").slice(0,80)+".csv";
  const text=csvText(list);
  const dl=await getSaver();
  if(dl){
    try{ await dl.save({filename,data:text}); }
    catch(err){
      if(err&&err.code==="declined")return;          // viewer said no; not an error
      if(btn)btn.textContent=t().csv_fail;
    }
    return;
  }
  const blob=new Blob([text],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}


/* ---------- SQL console over Parquet ---------- */
// The warehouse lives as Parquet next to the site. DuckDB-WASM reads it with
// HTTP range requests, so a query for one series pulls a few row groups rather
// than the whole 48 MB -- which is why this needs no server at all.
let duck=null, duckState="idle", duckErr=null;
const DATA_BASE = (window.SAUDI360_DATA_BASE || "data");
const PARQUET = ["fact_observation","dim_series","dim_product","dim_release",
                 "dim_geography","dim_place_label"];
const EXAMPLES = [
  ["Headline CPI, last 12 months",
   "SELECT period, round(value,2) AS index_value\nFROM fact_observation f JOIN dim_series s USING (series_key)\nWHERE s.category_id = '121421' AND lower(s.row_en) = 'general index'\n  AND s.kind = 'index' AND s.table_name = '2.1' AND s.index_base = '2023'\nORDER BY period DESC LIMIT 12"],
  ["Biggest products by observation count",
   "SELECT p.product, count(*) AS observations\nFROM fact_observation f JOIN dim_product p USING (product_key)\nGROUP BY 1 ORDER BY 2 DESC LIMIT 15"],
  ["Longest series in the corpus",
   "SELECT s.row_en, s.col_en, p.product, count(*) AS points,\n       min(f.period) AS first, max(f.period) AS last\nFROM fact_observation f\nJOIN dim_series s USING (series_key)\nJOIN dim_product p ON p.product_key = f.product_key\nWHERE NOT s.ambiguous AND NOT s.suspect\nGROUP BY 1,2,3 ORDER BY points DESC LIMIT 15"],
  ["Series flagged as unreliable",
   "SELECT p.product, count(*) AS series,\n       sum(CASE WHEN s.ambiguous THEN 1 ELSE 0 END) AS ambiguous,\n       sum(CASE WHEN s.suspect  THEN 1 ELSE 0 END) AS mixed_measure\nFROM dim_series s JOIN dim_product p USING (product_key)\nGROUP BY 1 ORDER BY ambiguous DESC LIMIT 15"],
];

async function duckReady(){
  if(duck)return duck;
  if(duckState==="failed")return null;
  duckState="loading";
  try{
    const mod=await import("https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm");
    const bundle=await mod.selectBundle(mod.getJsDelivrBundles());
    const worker=await mod.createWorker(bundle.mainWorker);
    const db=new mod.AsyncDuckDB(new mod.ConsoleLogger(mod.LogLevel.ERROR),worker);
    await db.instantiate(bundle.mainModule,bundle.pthreadWorker);
    const con=await db.connect();
    // Each table becomes a view over its Parquet file, read remotely. The URL
    // must be absolute: DuckDB's own filesystem does not resolve a relative
    // path against the page, it just reports the file as missing.
    for(const t of PARQUET){
      const url=new URL(`${DATA_BASE}/${t}.parquet`, location.href).href;
      await con.query(`CREATE OR REPLACE VIEW ${t} AS SELECT * FROM read_parquet('${url}')`);
    }
    duck={db,con}; duckState="ready"; return duck;
  }catch(e){ duckErr=e; duckState="failed"; return null; }
}

async function wireData(){
  const T_=t(), stat=$("#sqlstat"), out=$("#sqlout");
  const ex=$("#sqlex");
  if(ex)ex.onclick=e=>{const b=e.target.closest("[data-i]"); if(!b)return;
    $("#sql").value=EXAMPLES[+b.dataset.i][1];};
  const d=await duckReady();
  if(!d){
    const missing=duckErr&&/No files found|404|Failed to fetch/i.test(String(duckErr.message||duckErr));
    if(stat)stat.textContent=missing?T_.sql_nodata:T_.sql_unavail;
    return;
  }
  try{
    const r=await d.con.query("SELECT (SELECT count(*) FROM fact_observation) AS n, (SELECT count(*) FROM dim_product) AS p");
    const row=r.toArray()[0];
    if(stat)stat.textContent=T_.sql_ready.replace("{n}",num(Number(row.n))).replace("{p}",num(Number(row.p)));
  }catch(e){ if(stat)stat.textContent=T_.sql_unavail; return; }

  const run=async()=>{
    const q=$("#sql").value.trim(); if(!q)return;
    stat.textContent=T_.sql_running;
    const t0=performance.now();
    try{
      const res=await d.con.query(q);
      const rows=res.toArray().slice(0,500);
      const ms=Math.round(performance.now()-t0);
      stat.textContent=T_.sql_rows.replace("{n}",num(rows.length)).replace("{ms}",num(ms));
      if(!rows.length){ out.innerHTML=`<p class="muted" style="padding:16px">0</p>`; return; }
      const cols=Object.keys(rows[0]);
      out.innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${cols.map(c=>{
          const v=r[c];
          const isNum=typeof v==="number"||typeof v==="bigint";
          return `<td${isNum?' class="n"':''}>${esc(v==null?"—":(typeof v==="bigint"?v.toString():v))}</td>`;
        }).join("")}</tr>`).join("")}</tbody></table>
        ${rows.length>=500?`<p class="note" style="padding:0 12px 12px">${esc(T_.sql_limit)}</p>`:""}`;
    }catch(e){
      stat.textContent=T_.sql_err;
      out.innerHTML=`<pre class="mono" style="padding:16px;white-space:pre-wrap;color:var(--warn)">${esc(String(e.message||e))}</pre>`;
    }
  };
  $("#sqlrun").onclick=run;
  $("#sql").addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();run();}});
  run();
}

function render(){

  const h=(location.hash||"#/").slice(1);
  document.querySelectorAll("a.tab").forEach(a=>a.classList.toggle("on",a.dataset.nav===h));
  const v=$("#view");
  if(h.startsWith("/product/")){const id=decodeURIComponent(h.slice(9));
    v.innerHTML=vProduct(id); drawProduct(D.products.find(p=>p.id===id));}
  else if(h.startsWith("/domain/")){v.innerHTML=vDomain(decodeURIComponent(h.slice(8)));}
  else if(h==="/catalogue"){v.innerHTML=vCatalogue();}
  else if(h==="/explore"){v.innerHTML=vExplore(); drawExplore();}
  else if(h==="/data"){v.innerHTML=vData(); wireData();}
  else if(h==="/map"){v.innerHTML=vMap();
    if(!G){loadGeo().then(ok=>{ if(ok&&(location.hash||"#/").slice(1)==="/map"){
      v.innerHTML=vMap(); drawMap(); } else if(!ok){
      v.innerHTML='<div class="warnbox"><b>Could not load the map data.</b></div>'; }});}
    else drawMap();}
  else if(h==="/lens"){
    if(!G){loadGeo().then(()=>{ if((location.hash||"#/").slice(1)==="/lens") v.innerHTML=vLens(); });}
    v.innerHTML=vLens();}
  else {v.innerHTML=vHome();}
  window.scrollTo({top:0});
}
